server.port=8089
spring.application.name=ai-service

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8762/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/revtalent_db

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/revtalent_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
jwt.secret=supersecretkeywhichmustbelongenoughforhmacsha256
jwt.expiration=86400000
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
chroma.base-url=${CHROMA_BASE_URL:http://localhost:8000}
